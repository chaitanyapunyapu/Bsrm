<mat-toolbar color="primary" class="navbar-toolbar sticky-top shadow-sm">
  <div class="container d-flex align-items-center">
    <!-- Brand -->
    <a class="brand-link me-4" routerLink="/home">
      <span class="text-gradient fw-bold fs-4">BSRM</span>
    </a>

    <!-- Nav Links (Desktop) -->
    <div class="d-none d-md-flex align-items-center flex-grow-1">
      <a mat-button routerLink="/home" routerLinkActive="active-nav">Home</a>
      <a mat-button routerLink="/motor" routerLinkActive="active-nav">Motor</a>
      <a mat-button routerLink="/about" routerLinkActive="active-nav">About</a>
      <a mat-button routerLink="/contact" routerLinkActive="active-nav">Contact</a>
    </div>

    <!-- Right Side Actions -->
    <div class="ms-auto d-flex align-items-center">
      <ng-container *ngIf="!authenticated">
        <a mat-stroked-button color="accent" routerLink="/" class="me-2">Login</a>
        <a mat-flat-button color="accent" routerLink="/register">Join Us</a>
      </ng-container>

      <ng-container *ngIf="authenticated">
        <button mat-icon-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </ng-container>
    </div>
  </div>
</mat-toolbar>
