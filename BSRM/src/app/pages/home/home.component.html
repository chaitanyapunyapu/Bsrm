<div class="home-wrapper">
  <!-- Hero Section -->
  <section class="hero-section" [style.backgroundImage]="'url(assets/hero-banner.png)'">
    <div class="hero-overlay">
      <div class="container text-center">
        <h1 class="hero-title mb-4 animate__animated animate__fadeInDown">
          {{ message }}
        </h1>
        <p class="hero-subtitle mb-5 animate__animated animate__fadeIn">
          Explore the finest collection of premium motorcycles. Your journey begins here.
        </p>
        <div class="hero-actions">
          <button mat-flat-button color="accent" routerLink="/motor" class="explore-btn">
            EXPLORE MODELS <mat-icon>arrow_forward</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Brands Section -->
  <section class="brands-section py-5">
    <div class="container">
      <h2 class="section-title text-center mb-5">
        World-Class <span class="text-gradient">Partners</span>
      </h2>
      <div class="row g-4 justify-content-center">
        <div class="col-6 col-md-3 col-lg-2" *ngFor="let ac of bikes">
          <mat-card class="brand-card shadow-hover" routerLink="{{ac.link}}">
            <div class="brand-logo-wrapper">
              <img [src]="ac.logo" [alt]="ac.alt" class="brand-logo">
            </div>
          </mat-card>
        </div>
      </div>
    </div>
  </section>
</div>
