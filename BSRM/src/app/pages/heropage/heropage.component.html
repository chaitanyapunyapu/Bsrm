<div class="detail-page-container" *ngIf="heroData">
  <div class="container">
    <!-- Back Button -->
    <button mat-button class="back-btn mb-4" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon> Back to Models
    </button>

    <mat-card class="detail-card">
      <div class="row g-0">
        <!-- Image Sector -->
        <div class="col-lg-7">
          <div class="detail-img-sector" (click)="toggleImage()">
            <img [src]="heroData.vimg" [alt]="heroData.Model">
            <div class="zoom-hint">
              <mat-icon>zoom_in</mat-icon> Click to expand
            </div>
          </div>
        </div>

        <!-- Info Sector -->
        <div class="col-lg-5">
          <div class="detail-info-sector h-100">
            <h1 class="display-5 fw-bold mb-1">{{heroData.Model}}</h1>
            <p class="text-muted mb-4 fs-5">{{heroData.Type}}</p>

            <div class="detail-price">{{heroData.price | currency:'INR':'symbol':'1.0-0'}}</div>

            <div class="specs-grid mb-5">
              <div class="spec-item">
                <span class="spec-label">Engine</span>
                <span class="spec-value">{{heroData.Engine}}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Gearbox</span>
                <span class="spec-value">{{heroData.Gears}} Speed</span>
              </div>
            </div>

            <button mat-raised-button color="primary" class="btn-primary w-100 py-3" routerLink="/address">
              PROCEED TO BOOKING <mat-icon>keyboard_double_arrow_right</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </mat-card>
  </div>

  <!-- Image Lightbox Modal -->
  <div class="image-lightbox" *ngIf="isImageOpen">
    <button mat-icon-button class="lightbox-close" (click)="toggleImage()">
      <mat-icon>close</mat-icon>
    </button>
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <img [src]="heroData.vimg" [alt]="heroData.Model">
    </div>
  </div>
</div>

<!-- Loading State -->
<div *ngIf="!heroData" class="container py-5 text-center">
  <mat-spinner color="primary" class="mx-auto"></mat-spinner>
  <p class="mt-3 text-muted">Loading bike details...</p>
</div>
