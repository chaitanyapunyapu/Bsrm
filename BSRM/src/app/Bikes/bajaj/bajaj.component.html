<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-5">
    <h1 class="text-gradient display-4 fw-bold">Bajaj <span class="text-dark">Collection</span></h1>
    <mat-icon class="brand-icon-large text-muted">motorcycle</mat-icon>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="d-flex justify-content-center py-5">
    <mat-progress-spinner mode="indeterminate" color="primary"></mat-progress-spinner>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="alert alert-danger shadow-sm border-0 rounded-4" role="alert">
    <mat-icon>error</mat-icon> {{ error }}
  </div>

  <!-- Content -->
  <div class="row g-4" *ngIf="!loading && !error">
    <div class="col-12 col-sm-6 col-lg-3" *ngFor="let vd of bikes">
      <mat-card class="bike-card h-100" [routerLink]="['/bajaj', vd.id]">
        <div class="card-img-wrapper">
          <img [src]="vd.vimg" [alt]="vd.Model">
        </div>
        <mat-card-header class="mt-3">
          <mat-card-title class="fw-bold">{{vd.Model}}</mat-card-title>
          <mat-card-subtitle>{{vd.Type}}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="mt-2">
          <div class="price-tag mb-3">{{vd.price | currency:'INR':'symbol':'1.0-0'}}</div>
          <div class="specs-grid">
            <div class="spec-item">
              <span class="spec-label">Engine</span>
              <span class="spec-value">{{vd.Engine}}</span>
            </div>
            <div class="spec-item text-end">
              <span class="spec-label">Gears</span>
              <span class="spec-value">{{vd.Gears}}</span>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions align="end" class="pb-3 px-3">
          <button mat-flat-button color="primary" class="book-btn w-100" routerLink="/address" (click)="func(); $event.stopPropagation()">
            BOOK INDENT <mat-icon>arrow_right_alt</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !error && bikes.length === 0" class="text-center py-5">
    <mat-icon class="display-1 text-muted opacity-25">inventory_2</mat-icon>
    <h3 class="text-muted mt-3">No Bajaj models currently available.</h3>
  </div>
</div>
